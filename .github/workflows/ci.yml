name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            tlias-parent/pom.xml
            tlias-pojo/pom.xml
            tlias-utils/pom.xml
            tlias-web-management/pom.xml

      - name: Build and test
        run: ./tlias-web-management/mvnw --batch-mode --no-transfer-progress --file tlias-parent/pom.xml verify
