<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>上传文件</title>
</head>
<body>

    <form action="/upload" method="post" enctype="multipart/form-data">
        姓名: <input type="text" name="name"><br>
        年龄: <input type="number" name="age" min="0"><br>
        头像: <input type="file" name="file" accept="image/jpeg,image/png,image/gif,image/webp" required><br>
        <input type="submit" value="提交">
    </form>

</body>
</html>
